[project]
name = "voicebox-colab"
version = "0.1.0"
description = "Google Colab + Gradio adaptation of Jamie Pine Voicebox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "gradio>=4.44.0",
  "soundfile>=0.12.0",
  "librosa>=0.10.0",
  "numpy>=1.24.0",
  "pedalboard>=0.9.0",
  "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4", "misaki[en,ja,zh]>=0.9.4", "unidic-lite>=1.0.8"]
qwen = ["qwen-tts>=0.0.5"]
chatterbox = ["chatterbox-tts"]

[project.scripts]
voicebox-colab = "launch:main"

[tool.setuptools.packages.find]
include = ["voicebox_colab*"]
